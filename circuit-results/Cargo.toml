[package]
name = "davinci-zkvm-results"
version = "0.1.0"
edition = "2021"
default-run = "davinci-zkvm-results"

[dependencies]
ziskos = "=1.3.0-alpha"
# circuit-primitives is a symlink to ../circuit-primitives. A path outside
# this package makes cargo hash the absolute checkout path into the symbol
# names, so the ELF (and its vk) would depend on where the repo lives.
circuit-primitives = { path = "circuit-primitives" }
