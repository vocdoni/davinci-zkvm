[package]
name = "davinci-zkvm-circuit"
version = "0.1.0"
edition = "2021"
default-run = "davinci-zkvm-circuit"

[dependencies]
ziskos = "=1.3.2-alpha"
# circuit-primitives is a symlink to ../circuit-primitives. A path outside
# this package makes cargo hash the absolute checkout path into the symbol
# names, so the ELF (and its vk) would depend on where the repo lives.
circuit-primitives = { path = "circuit-primitives" }

# Fat LTO lets the ziskos syscall stubs (`csrs` + `ret`) inline into the hot
# loops: about 8% less emulator cost on the batch guest, identical outputs.
# The aggregator keeps the default profile: its in-guest STARK verifier has
# no emulator test without real proofs.
[profile.release]
lto = "fat"
codegen-units = 1
