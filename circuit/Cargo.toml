[package]
name = "davinci-zkvm-circuit"
version = "0.1.0"
edition = "2021"
default-run = "davinci-zkvm-circuit"

[[bin]]
name = "davinci-zkvm-circuit"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", tag = "v0.16.0" }

davinci-stark = { path = "../..", default-features = false }
ecgfp5 = { path = "../../vendor/ecgfp5/rust", package = "ecgfp5" }

[dev-dependencies]
davinci-zkvm-input-gen = { path = "../input-gen" }
p3-field = "0.4.2"
p3-goldilocks = "0.4.2"
p3-symmetric = "0.4.2"
postcard = { version = "1.0", features = ["alloc"], default-features = false }
sha2 = "0.10"
sha3 = "0.10"
