[workspace]
members = [
    "input-gen",
    "rust-sdk",
    "service",
]
# circuit/, circuit-aggregator/ and circuit-results/ are ZisK RISC-V guest
# programs — build with cargo-zisk from inside each directory.
# circuit-primitives/ is their shared library. All require the +zisk toolchain
# and cannot be compiled with standard cargo.
exclude = ["circuit", "circuit-primitives", "circuit-aggregator", "circuit-results"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/vocdoni/davinci-zkvm"
