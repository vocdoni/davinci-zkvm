[workspace]
members = [
    "input-gen",
    "service",
]
# circuit/ and circuit-aggregator/ are ZisK RISC-V guest programs — build with
# cargo-zisk from inside each directory. circuit-primitives/ is their shared
# library. All require the +zisk toolchain and cannot be compiled with
# standard cargo.
exclude = ["circuit", "circuit-primitives", "circuit-aggregator"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vocdoni/davinci-zkvm"
