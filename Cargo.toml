[workspace]
members = [
    "input-gen",
    "recursion-aggregator",
    "service",
]
# circuit/ is a ZisK RISC-V guest program — build with: make build-circuit
# It requires the +zisk toolchain and cannot be compiled with standard cargo.
# Plonky3-recursion/ is its own workspace with its own members.
exclude = ["circuit", "Plonky3-recursion"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vocdoni/davinci-zkvm"
