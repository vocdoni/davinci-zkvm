[package]
name = "davinci-zkvm-recursion-aggregator"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Aggregates N davinci-stark ballot proofs into 1 batch-stark proof using Plonky3-recursion"

[dependencies]
# davinci-stark for BallotAir, BallotConfig, proof types
davinci-stark = { path = "../../" }

# Plonky3-recursion for native recursive aggregation
p3-recursion = { path = "../Plonky3-recursion/recursion" }
p3-circuit = { path = "../Plonky3-recursion/circuit" }
p3-circuit-prover = { path = "../Plonky3-recursion/circuit-prover" }

# Plonky3 core crates (same git rev as davinci-stark)
p3-air = { git = "https://github.com/Plonky3/Plonky3", rev = "00188f0763d5eb86c5cc1d1b7c5a56cbab356593" }
p3-batch-stark = { git = "https://github.com/Plonky3/Plonky3", rev = "00188f0763d5eb86c5cc1d1b7c5a56cbab356593" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3", rev = "00188f0763d5eb86c5cc1d1b7c5a56cbab356593" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3", rev = "00188f0763d5eb86c5cc1d1b7c5a56cbab356593" }
p3-field = { git = "https://github.com/Plonky3/Plonky3", rev = "00188f0763d5eb86c5cc1d1b7c5a56cbab356593" }
p3-fri = { git = "https://github.com/Plonky3/Plonky3", rev = "00188f0763d5eb86c5cc1d1b7c5a56cbab356593" }
p3-goldilocks = { git = "https://github.com/Plonky3/Plonky3", rev = "00188f0763d5eb86c5cc1d1b7c5a56cbab356593" }
p3-lookup = { git = "https://github.com/Plonky3/Plonky3", rev = "00188f0763d5eb86c5cc1d1b7c5a56cbab356593" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3", rev = "00188f0763d5eb86c5cc1d1b7c5a56cbab356593" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3", rev = "00188f0763d5eb86c5cc1d1b7c5a56cbab356593" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3", rev = "00188f0763d5eb86c5cc1d1b7c5a56cbab356593" }
p3-uni-stark = { git = "https://github.com/Plonky3/Plonky3", rev = "00188f0763d5eb86c5cc1d1b7c5a56cbab356593" }

# Serialization
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

# Error handling and logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
p3-util = { git = "https://github.com/Plonky3/Plonky3", rev = "00188f0763d5eb86c5cc1d1b7c5a56cbab356593" }
rand = "0.10"
