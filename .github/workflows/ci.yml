name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p davinci-zkvm-service
      - run: cargo clippy -p davinci-zkvm-service -- -D warnings

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-sdk/go.mod
          cache-dependency-path: go-sdk/go.sum
      - name: vet + build
        run: |
          cd go-sdk
          go vet ./...
          go build ./...
      - name: build integration tests
        run: cd go-sdk/tests && go build ./integration/...
      - name: gofmt
        run: |
          files=$(gofmt -l go-sdk/)
          if [ -n "$files" ]; then
            echo "Files not formatted:"
            echo "$files"
            exit 1
          fi
