name: Docker

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string
      push:
        required: false
        type: boolean
        default: false

jobs:
  docker:
    name: ${{ inputs.push && 'Build and Publish' || 'Build' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # A release tag (v0.1.0) also moves `latest`, which is what
      # Watchtower-managed provers follow. Prereleases (v0.2.0-rc1) don't.
      - name: Prepare tags
        id: tags
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          primary=${IMAGE_TAG//\//-}
          tags="vocdoni/davinci-zkvm:${primary}"$'\n'"ghcr.io/vocdoni/davinci-zkvm:${primary}"
          if [[ "$primary" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags+=$'\n'"vocdoni/davinci-zkvm:latest"$'\n'"ghcr.io/vocdoni/davinci-zkvm:latest"
          fi
          {
            echo 'list<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # The CUDA prover image. Proving keys are mounted at run time, never
      # baked in (see docker-compose.yml).
      - name: ${{ inputs.push && 'Build and Publish' || 'Build' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cuda
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
