name: Set up ZisK (CPU, no keys)
description: >-
  Installs the ZisK CPU binaries (cargo-zisk, ziskemu) and the guest Rust
  toolchain with ziskup, without proving keys. GitHub-hosted runners cache
  ~/.zisk by version; self-hosted runners keep one install per version in the
  runner tool cache. Needs rustup on the PATH.

inputs:
  version:
    description: ZisK release, bare semver
    default: 1.3.0-alpha

runs:
  using: composite
  steps:
    # ziskemu and cargo-zisk link openmpi, libsodium, gmp and libomp. Guest
    # builds also run host build scripts: proofman's C++ libstarks (nasm,
    # nlohmann-json, libcrypto) and bindgen for zisk-zkvm-interface (libclang).
    - name: Install system packages
      shell: bash
      run: |
        set -euo pipefail
        SUDO=$(command -v sudo || true)
        $SUDO apt-get update
        $SUDO apt-get install -y --no-install-recommends \
          libopenmpi-dev libsodium-dev libgmp-dev libomp-dev \
          nlohmann-json3-dev libssl-dev nasm libclang-dev curl

    - name: Choose the install dir
      id: dir
      shell: bash
      env:
        ZISK_VERSION: ${{ inputs.version }}
      run: |
        if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" ]]; then
          echo "dir=$RUNNER_TOOL_CACHE/zisk/$ZISK_VERSION" >> "$GITHUB_OUTPUT"
        else
          echo "dir=$HOME/.zisk" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore ~/.zisk
      if: runner.environment == 'github-hosted'
      uses: actions/cache@v5
      with:
        path: ~/.zisk
        key: zisk-${{ runner.os }}-${{ inputs.version }}-cpu-nokey-v1

    # ziskup installs under $XDG_CONFIG_HOME when it is set, as on hosted
    # runners, and fetches the proving key when GH_RUNNER is set; ZISK_DIR
    # pins the location. The lock serializes jobs sharing a self-hosted box.
    - name: Install ZisK with ziskup
      shell: bash
      env:
        ZISK_VERSION: ${{ inputs.version }}
        ZISK_DIR: ${{ steps.dir.outputs.dir }}
      run: |
        set -euo pipefail
        unset XDG_CONFIG_HOME GH_RUNNER
        mkdir -p "$(dirname "$ZISK_DIR")"
        exec 9>"$(dirname "$ZISK_DIR")/.install.lock"
        flock 9
        if [[ ! -x "$ZISK_DIR/bin/cargo-zisk" || ! -d "$ZISK_DIR/toolchains" ]]; then
          curl -fsSL "https://raw.githubusercontent.com/0xPolygonHermez/zisk/v${ZISK_VERSION}/ziskup/ziskup" -o "$RUNNER_TEMP/ziskup"
          chmod +x "$RUNNER_TEMP/ziskup"
          "$RUNNER_TEMP/ziskup" -v "$ZISK_VERSION" --cpu --nokey -y
        fi

    # cargo-zisk builds with the rustup toolchain named `zisk`; a cached or
    # shared install still needs the link in this job's rustup.
    - name: Link the zisk rustup toolchain
      shell: bash
      env:
        ZISK_DIR: ${{ steps.dir.outputs.dir }}
      run: |
        set -euo pipefail
        if ! rustup toolchain list | grep -q '^zisk'; then
          tc=$(find "$ZISK_DIR/toolchains" -mindepth 1 -maxdepth 1 -type d | head -n1)
          test -x "$tc/bin/rustc"
          rustup toolchain link zisk "$tc"
        fi

    - name: Check the install
      shell: bash
      env:
        ZISK_DIR: ${{ steps.dir.outputs.dir }}
      run: |
        set -euo pipefail
        echo "$ZISK_DIR/bin" >> "$GITHUB_PATH"
        echo "ZISK_HOME=$ZISK_DIR" >> "$GITHUB_ENV"
        for b in ziskemu cargo-zisk; do
          if ldd "$ZISK_DIR/bin/$b" | grep 'not found'; then
            echo "::error::$b has unresolved shared libraries"
            exit 1
          fi
        done
        "$ZISK_DIR/bin/cargo-zisk" --version
        "$ZISK_DIR/bin/ziskemu" --version
        rustup toolchain list | grep -q '^zisk'
